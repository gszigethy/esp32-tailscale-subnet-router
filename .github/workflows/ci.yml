name: PlatformIO Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize report directory
        run: echo "SIZE_DIR=$RUNNER_TEMP/firmware-size" >> "$GITHUB_ENV"

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core
        # Hash-locked and wheels only: no unpinned dependency and no package
        # setup script runs on the runner (see .github/ci/requirements.txt).
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/ci/requirements.txt

      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}" HEAD

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          mkdir -p "$SIZE_DIR"
          pio run -e esp32-s3 | tee "$SIZE_DIR/head-size.txt"

      - name: Static analysis (Cppcheck)
        run: pio check -e esp32-s3 --skip-packages --fail-on-defect=high


      - name: Check formatting on changed C/C++ lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git diff --no-color --unified=0 "$BASE_SHA" HEAD -- main/*.c main/*.h 'components/**/*.c' 'components/**/*.h' | clang-format-diff-18 -p1 -style=file -binary clang-format-18 > "$RUNNER_TEMP/format.patch"
          if [ -s "$RUNNER_TEMP/format.patch" ]; then
            cat "$RUNNER_TEMP/format.patch"
            exit 1
          fi

      - name: Firmware size comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          stat -c '%s' .pio/build/esp32-s3/firmware.bin > "$SIZE_DIR/head-bytes.txt"
          if [ -n "$BASE_SHA" ]; then
            git worktree add --detach "$SIZE_DIR/base" "$BASE_SHA"
            git -C "$SIZE_DIR/base" submodule update --init --recursive
            (cd "$SIZE_DIR/base" && pio run -e esp32-s3) > "$SIZE_DIR/base-size.txt"
            stat -c '%s' "$SIZE_DIR/base/.pio/build/esp32-s3/firmware.bin" > "$SIZE_DIR/base-bytes.txt"
          fi
          python .github/ci/firmware_size.py
