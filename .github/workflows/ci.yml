name: PlatformIO Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize report directory
        run: echo "SIZE_DIR=$RUNNER_TEMP/firmware-size" >> "$GITHUB_ENV"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core
        # Hash-locked and wheels only: no unpinned dependency and no package
        # setup script runs on the runner (see .github/ci/requirements.txt).
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/ci/requirements.txt

      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}" HEAD

      - name: Validate Python test tooling
        run: python -m compileall -q tools

      - name: Test W5500 exit-node integration on host
        run: python tools/test_w5500_rebase.py

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          mkdir -p "$SIZE_DIR"
          pio run -e esp32-s3 | tee "$SIZE_DIR/head-size.txt"
          stat -c '%s' .pio/build/esp32-s3/firmware.bin > "$SIZE_DIR/head-bytes.txt"

      - name: Verify firmware image
        run: |
          test -s .pio/build/esp32-s3/firmware.bin
          python - <<'PY'
          from pathlib import Path
          size = Path(".pio/build/esp32-s3/firmware.bin").stat().st_size
          limit = 1966080
          print(f"firmware.bin: {size} bytes ({size / limit:.1%} of app partition)")
          if size >= limit:
              raise SystemExit("firmware image exceeds app partition")
          PY

      - name: Static analysis (Cppcheck)
        run: pio check -e esp32-s3 --skip-packages --fail-on-defect=medium

      - name: Check formatting on changed C/C++ lines
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git diff --no-color --unified=0 "$BASE_SHA" "$HEAD_SHA" -- 'main/*.c' 'main/*.h' 'components/**/*.c' 'components/**/*.h' > "$RUNNER_TEMP/source.diff"
          if [ ! -s "$RUNNER_TEMP/source.diff" ]; then
            echo "No changed C/C++ lines to format."
            exit 0
          fi
          if ! clang-format-diff-18 -p1 -style=file -binary clang-format-18 < "$RUNNER_TEMP/source.diff" > "$RUNNER_TEMP/format.patch"; then
            cat "$RUNNER_TEMP/format.patch"
            echo "::error::Changed-line formatting failed; see the patch or formatter error above."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/format.patch" ]; then
            cat "$RUNNER_TEMP/format.patch"
            exit 1
          fi

      - name: Firmware size comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git worktree add --detach "$SIZE_DIR/base" "$BASE_SHA"
            git -C "$SIZE_DIR/base" submodule update --init --recursive
            (cd "$SIZE_DIR/base" && pio run -e esp32-s3) > "$SIZE_DIR/base-size.txt"
            stat -c '%s' "$SIZE_DIR/base/.pio/build/esp32-s3/firmware.bin" > "$SIZE_DIR/base-bytes.txt"
          fi
          python .github/ci/firmware_size.py
