name: Watch upstream stable releases

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-stable-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for new upstream stable release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamOwner = 'Csontikka';
            const upstreamRepo = 'esp32-tailscale-subnet-router';
            const { owner, repo } = context.repo;

            // GitHub's prerelease flag is authoritative; also reject
            // obvious prerelease tags in case an upstream release is misflagged.
            const prereleaseTag = /(?:^|[.\-_])(alpha|beta|rc|pre|preview|dev)(?:[.\-_]?\d+)?(?:$|[.\-_])/i;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: upstreamOwner, repo: upstreamRepo, per_page: 100 }
            );
            const stable = releases
              .filter(r => !r.draft && !r.prerelease && !prereleaseTag.test(r.tag_name))
              .sort((a, b) =>
                new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at)
              );
            if (!stable.length) {
              core.info('No upstream stable releases found.');
              return;
            }

            const release = stable[0];
            const marker = `<!-- upstream-stable-release:${upstreamOwner}/${upstreamRepo}@${release.id} -->`;
            // Include closed issues so a manually closed notification stays closed.
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 }
            );
            if (issues.some(issue => !issue.pull_request && issue.body?.includes(marker))) {
              core.info(`Already reported ${release.tag_name}; nothing to do.`);
              return;
            }

            const title = `Upstream stable release available: ${release.tag_name}`;
            const body = [
              marker,
              `A new stable release is available in [${upstreamOwner}/${upstreamRepo}](https://github.com/${upstreamOwner}/${upstreamRepo}).`,
              '',
              `- **Version:** \`${release.tag_name}\``,
              `- **Release:** ${release.html_url}`,
              `- **Published:** ${release.published_at || release.created_at}`,
              '',
              'Review the upstream changes and decide whether to integrate them into this fork.',
              'This automation does **not** merge, update, or release anything.'
            ].join('\n');
            const issue = await github.rest.issues.create({ owner, repo, title, body });
            core.info(`Created ${issue.data.html_url}`);
